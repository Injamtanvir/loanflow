services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: loanflow
      POSTGRES_USER: loanflow
      POSTGRES_PASSWORD: ${LOANFLOW_DB_PASSWORD:-local_demo_only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - loanflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanflow -d loanflow"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  loanflow_pg:
