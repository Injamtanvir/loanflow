name: loanflow-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: loanflow
          POSTGRES_USER: loanflow
          POSTGRES_PASSWORD: test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loanflow -d loanflow"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: loanflow
      PGUSER: loanflow
      PGPASSWORD: test_only
      LOANFLOW_TEST_POSTGRES: 1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - run: Rscript --vanilla tests/bootstrap.R
      - run: Rscript scripts/setup.R
      - run: Rscript tests/testthat.R
      - run: Rscript scripts/build_report.R outputs/ci
